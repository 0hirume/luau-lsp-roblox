name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            arch: x86_64
            upstream_key: windows-x86_64
            executable: luau-lsp.exe
            upstream_executable: luau-lsp-server.exe
            archive: zip
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
            upstream_key: linux-x86_64
            executable: luau-lsp
            upstream_executable: luau-lsp-server
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
            upstream_key: linux-aarch64
            executable: luau-lsp
            upstream_executable: luau-lsp-server
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: macos
            arch: x86_64
            upstream_key: macos-universal
            executable: luau-lsp
            upstream_executable: luau-lsp-server
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            os: macos
            arch: aarch64
            upstream_key: macos-universal
            executable: luau-lsp
            upstream_executable: luau-lsp-server
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: build wrapper
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked
      - name: assemble distribution
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OS_NAME: ${{ matrix.os }}
          ARCH_NAME: ${{ matrix.arch }}
          UPSTREAM_KEY: ${{ matrix.upstream_key }}
          PUBLIC_EXECUTABLE: ${{ matrix.executable }}
          PRIVATE_EXECUTABLE: ${{ matrix.upstream_executable }}
          ARCHIVE_KIND: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          manifest=upstream/manifest.json
          upstream_repository="$(jq -er .repository "${manifest}")"
          upstream_version="$(jq -er .version "${manifest}")"
          upstream_commit="$(jq -er .commit "${manifest}")"
          upstream_asset="$(jq -er --arg key "${UPSTREAM_KEY}" '.release_assets[$key].name' "${manifest}")"
          expected_sha256="$(jq -er --arg key "${UPSTREAM_KEY}" '.release_assets[$key].sha256' "${manifest}")"
          expected_size="$(jq -er --arg key "${UPSTREAM_KEY}" '.release_assets[$key].size' "${manifest}")"
          release_version="${GITHUB_REF_NAME#v}"
          name="luau-lsp-v${release_version}-${OS_NAME}-${ARCH_NAME}"
          mkdir -p staging/resources dist upstream-download
          jq -n \
            --arg wrapper_version "${release_version}" \
            --arg upstream_version "${upstream_version}" \
            --arg upstream_commit "${upstream_commit}" \
            '{wrapper: {version: $wrapper_version}, upstream: {version: $upstream_version, commit: $upstream_commit}}' \
            > staging/versions.json
          cp "target/${TARGET}/release/${PUBLIC_EXECUTABLE}" "staging/${PUBLIC_EXECUTABLE}"
          curl --fail --location --retry 3 \
            "https://github.com/${upstream_repository}/releases/download/${upstream_version}/${upstream_asset}" \
            --output upstream.zip
          actual_size="$(wc -c < upstream.zip | tr -d '[:space:]')"
          test "${actual_size}" = "${expected_size}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual_sha256="$(sha256sum upstream.zip | awk '{print $1}')"
          else
            actual_sha256="$(shasum -a 256 upstream.zip | awk '{print $1}')"
          fi
          test "${actual_sha256}" = "${expected_sha256}"
          unzip -q upstream.zip -d upstream-download
          upstream_binary="$(find upstream-download -type f \( -name luau-lsp -o -name luau-lsp.exe \) -print -quit)"
          test -n "${upstream_binary}"
          cp "${upstream_binary}" "staging/${PRIVATE_EXECUTABLE}"
          if [[ "${OS_NAME}" != windows ]]; then
            chmod 755 "staging/${PUBLIC_EXECUTABLE}" "staging/${PRIVATE_EXECUTABLE}"
          fi
          "staging/${PRIVATE_EXECUTABLE}" --version | grep -F "${upstream_version}"
          "staging/${PRIVATE_EXECUTABLE}" --show-flags > upstream-flags.txt
          grep -q '=' upstream-flags.txt
          for security in None LocalUserSecurity PluginSecurity RobloxScriptSecurity; do
            curl --fail --location --retry 3 \
              "https://luau-lsp.pages.dev/type-definitions/globalTypes.${security}.d.luau" \
              --output "staging/resources/globalTypes.${security}.d.luau"
          done
          curl --fail --location --retry 3 \
            https://luau-lsp.pages.dev/api-docs/en-us.json \
            --output staging/resources/api-docs.json
          cp LICENSE staging/LICENSE-wrapper
          cp NOTICES.md staging/
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/${upstream_repository}/${upstream_commit}/LICENSE.md" \
            --output staging/LICENSE-upstream
          if [[ "${ARCHIVE_KIND}" == zip ]]; then
            (cd staging && 7z a "../dist/${name}.zip" ./*)
          else
            tar -C staging -czf "dist/${name}.tar.gz" .
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${name}."* > "${name}.sha256")
          else
            (cd dist && shasum -a 256 "${name}."* > "${name}.sha256")
          fi
      - name: upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the github release and upload its assets.
    steps:
      - name: download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: create github release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
