name: upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  update:
    name: update upstream pin
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write # required to push the generated update branch.
      pull-requests: write # required to create or update the review pr.
    steps:
      - name: check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: set up project tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false
          install_args: aqua:nushell/nushell

      - name: generate update
        run: nu .github/upstream.nu

      - name: open review pull request
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: nu .github/pull-request.nu
